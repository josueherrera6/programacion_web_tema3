<p-card [header]="producto().nombre">
  <p>{{ producto().descripcion }}</p>

  <p-tag
    severity="success"
    [rounded]="true"
    [value]="'$' + producto().precio.toLocaleString('es-MX')"
  />

  <ng-template #footer>
    <div class="acciones">
      <a [routerLink]="['/productos', producto().id]" pButton>
        <span pButtonLabel>Ver detalle</span>
      </a>
      <p-button
        [label]="esFavorito ? '💔 Quitar favorito' : '❤️ Agregar favorito'"
        [severity]="esFavorito ? 'secondary' : 'help'"
        [outlined]="!esFavorito"
        (onClick)="alternarFavorito($event)"
      />
    </div>
  </ng-template>
</p-card>
